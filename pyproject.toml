[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roboscientist"
version = "0.1.0"
description = "Auditable software virtual closed-loop laboratory for RoboScientist"
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[tool.setuptools.packages.find]
include = ["roboscientist*"]

[tool.setuptools.package-data]
"roboscientist.web" = ["static/*.html", "static/*.js", "static/*.css"]
